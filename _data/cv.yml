      description: Wearable BP monitoring from physiological signals, calibration-aware regression, domain adaptation, and product-level robustness.
    - title: Heart-Rate Deceleration Capacity Screening
      description: Wearable heart-risk screening using deceleration capacity theory, ECG/PPG representation learning, and contrastive predictive learning.
    - title: Orthogonal Polynomials and Biomedical Uncertainty Quantification
      description: Ph.D. research on recurrence algorithms, polynomial chaos expansion, UncertainSCI, and reliable biomedical simulations.

